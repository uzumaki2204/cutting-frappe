$kind: http-request
url: '{{baseUrl}}/api/method/cutting.reporting.admin_summary?created_from={{fromDate}}&created_to={{toDate}}&trash=0'
method: GET
headers:
  Accept: application/json
queryParams:
  - key: created_from
    value: '{{fromDate}}'
  - key: created_to
    value: '{{toDate}}'
  - key: trash
    value: '0'
order: 4000
examples: './.resources/Aggregate by creation date, product, color and market.resources/examples'
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("Expected HTTP status", () => pm.response.to.have.status(200));
      pm.test("Frappe message envelope", () => pm.expect(pm.response.json()).to.have.property("message"));
