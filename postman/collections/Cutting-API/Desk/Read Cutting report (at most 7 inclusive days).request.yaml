$kind: http-request
url: '{{baseUrl}}/api/method/cutting.reporting.report_detail?from_date={{fromDate}}&to_date={{toDate}}'
method: GET
headers:
  Accept: application/json
queryParams:
  - key: from_date
    value: '{{fromDate}}'
  - key: to_date
    value: '{{toDate}}'
order: 2000
examples: './.resources/Read Cutting report (at most 7 inclusive days).resources/examples'
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("Expected HTTP status", () => pm.response.to.have.status(200));
      pm.test("Frappe message envelope", () => pm.expect(pm.response.json()).to.have.property("message"));
