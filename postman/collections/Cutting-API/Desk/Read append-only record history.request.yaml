$kind: http-request
url: '{{baseUrl}}/api/method/cutting.api.history?name={{recordName}}'
method: GET
headers:
  Accept: application/json
queryParams:
  - key: name
    value: '{{recordName}}'
order: 1000
examples: './.resources/Read append-only record history.resources/examples'
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("Expected HTTP status", () => pm.response.to.have.status(200));
      pm.test("Frappe message envelope", () => pm.expect(pm.response.json()).to.have.property("message"));
