$kind: http-request
url: '{{baseUrl}}/api/method/cutting.api.register_device'
method: POST
headers:
  Accept: application/json
  X-Factory-Data-Epoch: "{{generation}}"
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "id": "{{deviceId}}",
      "device_name": "Cutting"
    }
order: 1000
examples: './.resources/Shared Factory Management device register_device.resources/examples'
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("Expected HTTP status", () => pm.response.to.have.status(200));
      pm.test("Approved Factory Device returned", () => {
        const device = pm.response.json().message.device;
        pm.expect(device.status).to.eql("Approved");
        pm.expect(device.is_active).to.eql(true);
        pm.expect(device.company).to.be.ok;
      });
