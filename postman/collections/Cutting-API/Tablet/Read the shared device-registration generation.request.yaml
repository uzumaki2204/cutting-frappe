$kind: http-request
url: '{{baseUrl}}/api/method/cutting.api.device_epoch'
method: GET
headers:
  Accept: application/json
order: 2000
examples: './.resources/Read the shared device-registration generation.resources/examples'
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("Expected HTTP status", () => pm.response.to.have.status(200));
      pm.test("Frappe message envelope", () => pm.expect(pm.response.json()).to.have.property("message"));
      pm.collectionVariables.set("generation", pm.response.json().message.generation || "");
