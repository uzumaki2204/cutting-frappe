$kind: http-request
url: '{{baseUrl}}/api/method/cutting.api.translations?lang=en'
method: GET
headers:
  Accept: application/json
queryParams:
  - key: lang
    value: 'en'
order: 1000
examples: './.resources/Read the shared UI-API translation catalog.resources/examples'
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("Expected HTTP status", () => pm.response.to.have.status(200));
      pm.test("Frappe message envelope", () => pm.expect(pm.response.json()).to.have.property("message"));
      pm.test("Localized messages exist", () => pm.expect(pm.response.json().message).to.have.property("ui.title"));
